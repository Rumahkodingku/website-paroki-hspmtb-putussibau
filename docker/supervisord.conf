[supervisord]
nodaemon = true
user = root
pidfile = /tmp/supervisord.pid
logfile = /dev/null
logfile_maxbytes = 0

[unix_http_server]
file = /var/run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///var/run/supervisor.sock

[program:php-fpm]
command = /usr/local/sbin/php-fpm -F
priority = 10
autostart = true
autorestart = true
startsecs = 3
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 20
autostart = true
autorestart = true
startsecs = 3
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue-default]
command = /usr/local/bin/php -d memory_limit=1024M /var/www/html/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=300 --max-time=3600 --memory=900 --no-interaction
user = www-data
priority = 30
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue-backups]
command = /usr/local/bin/php -d memory_limit=512M /var/www/html/artisan queue:work backups --queue=backups --sleep=3 --tries=1 --timeout=7200 --max-time=86400 --memory=480 --no-interaction
user = www-data
priority = 40
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stopwaitsecs = 7300
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command = /usr/local/bin/php /var/www/html/artisan schedule:work --no-interaction
user = www-data
priority = 50
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
